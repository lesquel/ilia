# The whole application, for a pilot deployment on one machine.
#
# Not a production topology for a municipality: there is one API container, the
# evaluation queue lives inside it, and the rate limiter counts in its memory.
# Scaling past one replica needs the shared-store decision (TRD §5.2) first —
# `docs/` says so, and so does `apps/api/README.md`.
#
# What it does give: the same images CI builds, the migrations applied before
# anything serves, and nothing starting until what it depends on is healthy.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ilia}
    volumes:
      - ilia-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ilia} -d ${POSTGRES_DB:-ilia}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Migrations run once, to completion, before the API starts. Letting the API
  # migrate on boot would mean N replicas racing to alter the same tables.
  migrate:
    build:
      context: ./apps/api
    command: ['alembic', 'upgrade', 'head']
    environment:
      ILIA_DATABASE_URL: ${ILIA_DATABASE_URL:?set ILIA_DATABASE_URL}
      ILIA_JWT_SECRET: ${ILIA_JWT_SECRET:?set ILIA_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./apps/api
    environment:
      ILIA_ENVIRONMENT: production
      ILIA_DATABASE_URL: ${ILIA_DATABASE_URL:?set ILIA_DATABASE_URL}
      ILIA_JWT_SECRET: ${ILIA_JWT_SECRET:?set ILIA_JWT_SECRET}
      ILIA_CORS_ORIGINS: ${ILIA_CORS_ORIGINS:?set ILIA_CORS_ORIGINS}
      ILIA_COOKIE_SECURE: 'true'
      ILIA_COOKIE_DOMAIN: ${ILIA_COOKIE_DOMAIN:-}
      # Empty runs the local stub, which grades nothing and says so. Prove a
      # real provider with GET /health/ready: `llm` must not be `local-stub`.
      # Allowed: anthropic | openai | gemini | deepseek | openai-compatible.
      ILIA_LLM_PROVIDER: ${ILIA_LLM_PROVIDER:-}
      ILIA_LLM_API_KEY: ${ILIA_LLM_API_KEY:-}
      ILIA_LLM_MODEL: ${ILIA_LLM_MODEL:-}
      ILIA_LLM_BASE_URL: ${ILIA_LLM_BASE_URL:-}
      ILIA_LLM_INPUT_PRICE_PER_MILLION: ${ILIA_LLM_INPUT_PRICE_PER_MILLION:-0}
      ILIA_LLM_OUTPUT_PRICE_PER_MILLION: ${ILIA_LLM_OUTPUT_PRICE_PER_MILLION:-0}
      # Required in production: the local adapter signs nothing, and the API
      # refuses to start with it there.
      ILIA_STORAGE_PROVIDER: ${ILIA_STORAGE_PROVIDER:?set ILIA_STORAGE_PROVIDER}
      ILIA_STORAGE_BUCKET: ${ILIA_STORAGE_BUCKET:-}
      ILIA_STORAGE_REGION: ${ILIA_STORAGE_REGION:-us-east-1}
      ILIA_STORAGE_ACCESS_KEY: ${ILIA_STORAGE_ACCESS_KEY:-}
      ILIA_STORAGE_SECRET_KEY: ${ILIA_STORAGE_SECRET_KEY:-}
      ILIA_STORAGE_ENDPOINT: ${ILIA_STORAGE_ENDPOINT:-}
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The image writes nothing. Anything that needs to would be a bug worth
    # finding here rather than in production.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: ./apps/mobile
      args:
        # Baked into the bundle: Expo inlines EXPO_PUBLIC_* at build time, so
        # this is one image per environment. Changing it means rebuilding.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?set EXPO_PUBLIC_API_URL}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  ilia-db-data:
