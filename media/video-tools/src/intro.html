<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<style>
@page{size:1280px 720px;margin:0}*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden}body{font-family:'Aptos','Segoe UI',sans-serif;color:#202630;background:#fff}
:root{--blue:#1b70fe;--ink:#202630;--muted:#707783;--paper:#fff;--wash:#eaf2ff;--leaf:#82aa78;--gold:#e8ad4f;--coral:#d98a77}
.frame{width:1280px;height:720px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 7% 84%,#eff6ff 0,transparent 35%),radial-gradient(ellipse at 90% 13%,#f8f8f5 0,transparent 33%),#fff}
.grain{position:absolute;inset:0;opacity:.16;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.09'/%3E%3C/svg%3E")}
.brand{position:absolute;top:32px;left:60px;display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.08em;color:#59616d;font-weight:650;z-index:4}.brand b{color:var(--blue);font-size:17px;letter-spacing:.16em}.brand i{width:5px;height:5px;border-radius:99px;background:#c8ccd2}
.scene-title,.eyebrow,.curriculum,.count{display:none}
.stage{position:absolute;inset:0;display:grid;place-items:center;padding-top:32px;opacity:0;transform:scale(.985);transition:opacity .35s ease,transform .45s ease}.active .stage{opacity:1;transform:scale(1)}.stage svg{width:1060px;height:478px;overflow:visible}
.draw{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:3.2}.blue{stroke:var(--blue)}.softblue{fill:var(--wash);stroke:none}.bluefill{fill:var(--blue);stroke:none}.leaf{fill:#c8ddbe;stroke:var(--ink);stroke-width:3.2;stroke-linejoin:round}.gold{fill:#f9e8c5;stroke:var(--ink);stroke-width:3.2}.coral{fill:#f3d5ce;stroke:var(--ink);stroke-width:3.2}.white{fill:#fff;stroke:var(--ink);stroke-width:4}.inkfill{fill:var(--ink);stroke:none}.glow{fill:#eef4ff;stroke:none}.label{font:600 19px 'Aptos','Segoe UI',sans-serif;fill:#303744}.small{font:500 15px 'Aptos','Segoe UI',sans-serif;fill:#626b77}.large{font:600 25px Georgia,serif;fill:#27303a}.blueText{fill:var(--blue);font-weight:700}.greenText{fill:#527b4d;font-weight:650}.lineDraw{stroke-dasharray:900;stroke-dashoffset:900;animation:write .75s cubic-bezier(.3,.7,.25,1) forwards}.late{animation-delay:.2s}.later{animation-delay:.42s}@keyframes write{to{stroke-dashoffset:0}}.float{transform-box:fill-box;transform-origin:center;animation:float 2.8s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.caption{position:absolute;left:190px;right:190px;bottom:62px;min-height:38px;text-align:center;font-size:20px;line-height:1.32;font-weight:500;color:#363c46;z-index:4;text-shadow:0 1px 0 #fff}.footer{position:absolute;left:60px;right:60px;bottom:29px;display:flex;align-items:center;gap:16px;color:#888e98;font-size:12px;letter-spacing:.055em}.progress{height:3px;flex:1;background:#e7e8eb;overflow:hidden}.progress span{height:100%;width:0;display:block;background:var(--blue)}.count{min-width:48px;text-align:right}.curriculum{position:absolute;right:60px;top:32px;color:#87909a;font-size:12px;letter-spacing:.03em;z-index:4}
</style>
</head>
<body>
<div class="frame" id="frame"><div class="grain"></div><div class="brand"><b>ILIA</b><i></i><span>Una práctica para preparar tu clase</span></div><div class="curriculum" id="curriculum"></div><div class="eyebrow" id="eyebrow"></div><div class="scene-title" id="title"></div><main class="stage" id="stage"></main><div class="caption" id="caption"></div><footer class="footer"><span>Un primer pedido para tu clase</span><div class="progress"><span id="progress"></span></div><span class="count" id="count"></span></footer></div>
<script>
const {beats,boundaries,duration}=window.ILIA;
const teacher=(x=220,y=350,s=1,pose='open')=>{
 const arms=pose==='think'?`<path class="draw lineDraw" d="M${x-8} ${y+71}q-57 10-67 57m76-56q31-18 19-48m-19 48q10 29 32 54"/>`:
 pose==='write'?`<path class="draw lineDraw" d="M${x-10} ${y+72}q-52 3-63 44m70-43q42 16 65 53"/>`:
 pose==='check'?`<path class="draw lineDraw" d="M${x-10} ${y+72}q-54 3-65 47m73-48q41-22 55-57"/>`:
 ` <path class="draw lineDraw" d="M${x-10} ${y+72}q-58-8-83-57m91 58q48-8 80-48"/>`;
 return `<g><path class="draw lineDraw" d="M${x-8} ${y+74}q-6 76-5 137m8-134q14 77 11 136m-17-50-33 61m44-61 35 61"/>${arms}<path class="white draw lineDraw" d="M${x-58} ${y+5}a53 53 0 1 1 106 0a53 53 0 0 1-106 0z"/><path class="draw lineDraw" d="M${x-39} ${y-38}q6-28 31-32m15 1q24 0 37 23"/><circle class="inkfill pop" cx="${x-20}" cy="${y+2}" r="4.5"/><circle class="inkfill pop late" cx="${x+17}" cy="${y+2}" r="4.5"/><path class="draw thin lineDraw late" d="M${x-17} ${y+25}q18 17 36-1"/></g>`;
};
const book=(x,y,w=145,h=105)=>`<g><path class="white draw lineDraw" d="M${x} ${y}q44-16 ${w/2} 6v${h}q-45-20 -${w/2} 2z"/><path class="white draw lineDraw late" d="M${x+w} ${y}q-44-16 -${w/2} 6v${h}q45-20 ${w/2} 2z"/><path class="draw thin lineDraw" d="M${x+w/2} ${y+7}v${h-1}m-${w/2-13}-${h-69}h45m-45 18h36m${w/2+13}-${h-69}h40m-40 18h32"/></g>`;
const sheet=(x,y,w,h)=>`<path class="white draw lineDraw" d="M${x} ${y}h${w-17}l17 17v${h-17}h-${w}z"/>`;
const garden=(x,y)=>`<g><path class="draw lineDraw" d="M${x} ${y+100}q80 22 165 0"/><path class="draw lineDraw late" d="M${x+35} ${y+100}v-47m47 49v-76m48 75v-53"/><path class="leaf" d="M${x+36} ${y+77}q-38-20-26-43 28 0 26 43m0-16q25-35 43-18-5 25-43 18"/><path class="leaf" d="M${x+82} ${y+63}q-37-26-21-49 25 3 21 49m0-22q18-36 40-23-2 24-40 23"/><path class="leaf" d="M${x+131} ${y+79}q-34-22-20-44 27 1 20 44m0-18q22-34 40-18-4 23-40 18"/><path class="draw thin lineDraw" d="M${x-1} ${y+105}q28-9 54 0t55 0 58 0"/></g>`;
const scenes={
desk:`<svg viewBox="0 0 1060 478">${teacher(285,180,1,'think')}<path class="draw lineDraw" d="M145 421h557m-510 0v-65q180-35 343 0v65M612 356v65"/><g class="float">${sheet(492,213,115,128,2)}</g><path class="draw blue lineDraw late" d="M658 300l59-36"/><circle class="gold pop" cx="779" cy="199" r="42"/><path class="draw lineDraw" d="M779 172v31l19 13"/><text class="small" x="741" y="264">mañana</text><path class="draw thin lineDraw late" d="M172 334q18-21 36 0m-18-18v37"/></svg>`,
read:`<svg viewBox="0 0 1060 478">${teacher(255,199,1,'think')}${book(490,252,190,138)}<path class="draw blue lineDraw" d="M585 274v91"/><text class="small blueText" text-anchor="middle" x="585" y="332">un cuento</text><path class="draw thin lineDraw late" d="M718 323q33 12 52 0m-43-14 12 14-12 13"/></svg>`,
ai:`<svg viewBox="0 0 1060 478">${teacher(230,206,1,'open')}<circle class="softblue pop" cx="515" cy="260" r="62"/><text class="large blueText" text-anchor="middle" x="515" y="269">IA</text><path class="draw blue lineDraw" d="M587 260h99m-18-15 18 15-18 15"/>${sheet(720,164,190,226)}<path class="draw thin lineDraw late" d="M751 207h117m-117 25h117"/><text class="large blueText" text-anchor="middle" x="807" y="302">borrador</text></svg>`,
vague:`<svg viewBox="0 0 1060 478">${teacher(207,204,1,'think')}${sheet(380,176,337,202)}<text class="large" text-anchor="middle" x="548" y="249">«Hazme una lectura</text><text class="large" text-anchor="middle" x="548" y="283">con preguntas»</text><g><circle class="softblue" cx="834" cy="186" r="43"/><text class="small blueText" text-anchor="middle" x="834" y="191">¿Grado?</text><circle class="gold" cx="929" cy="284" r="43"/><text class="small" text-anchor="middle" x="929" y="289">¿Meta?</text><circle class="coral" cx="828" cy="373" r="43"/><text class="small" text-anchor="middle" x="828" y="378">¿Contexto?</text></g></svg>`,
guess:`<svg viewBox="0 0 1060 478">${teacher(227,203,1,'think')}<path class="draw lineDraw" d="M420 376h450"/><circle class="coral pop" cx="490" cy="241" r="65"/><text class="large" x="470" y="252">?</text><circle class="gold pop late" cx="665" cy="241" r="65"/><text class="large" x="645" y="252">?</text><circle class="softblue pop later" cx="840" cy="241" r="65"/><text class="large blueText" x="820" y="252">?</text><path class="draw thin lineDraw" d="M490 314v45m175-45v45m175-45v45"/><text class="small" x="442" y="399">texto</text><text class="small" x="608" y="399">nivel</text><text class="small" x="780" y="399">preguntas</text></svg>`,
context:`<svg viewBox="0 0 1060 478">${teacher(208,199,1,'write')}${sheet(399,139,347,272)}<text class="small blueText" x="430" y="194">LENGUA · SÉPTIMO</text><text class="label" x="430" y="239">Ya leyeron un cuento.</text><path class="draw thin blue lineDraw" d="M430 266h263"/><text class="label" x="430" y="306">Ahora, un párrafo.</text><text class="label blueText" x="430" y="345">Cinco preguntas del texto.</text><text class="small" x="430" y="379">Sin inventar fuentes.</text><path class="draw blue lineDraw late" d="M780 263h44m-16-14 16 14-16 14"/>${sheet(843,213,126,159)}<path class="draw thin blue lineDraw later" d="M865 251h80m-80 22h80"/><text class="small blueText" text-anchor="middle" x="906" y="316">borrador</text></svg>`,
output:`<svg viewBox="0 0 1060 478">${teacher(206,203,1,'open')}${book(358,251,157,113)}${garden(609,223)}<circle class="gold pop" cx="562" cy="216" r="23"/><path class="draw blue lineDraw" d="M562 248v34"/><path class="draw lineDraw" d="M554 272l8 11 9-11"/><text class="large" x="554" y="187">1 idea</text><text class="small" x="640" y="367">El huerto del curso</text><path class="draw blue lineDraw late" d="M744 171q34-41 71 0m-70-1-5 17m5-17 18-1"/><circle class="leaf pop late" cx="844" cy="160" r="22"/><text class="small" x="790" y="211">una hoja nueva</text></svg>`,
topic:`<svg viewBox="0 0 1060 478">${teacher(214,196,1,'think')}${sheet(409,170,260,212)}<text class="small" x="440" y="216">El huerto del curso</text><text class="label" x="440" y="271">El curso cuida</text><text class="label" x="440" y="304">las plantas por turnos.</text><path class="draw blue lineDraw" d="M700 277h91m-17-15 17 15-17 15"/><ellipse class="softblue" cx="873" cy="272" rx="82" ry="70"/><text class="small blueText" text-anchor="middle" x="873" y="261">¿De qué trata</text><text class="small blueText" text-anchor="middle" x="873" y="284">el párrafo?</text><text class="large" text-anchor="middle" x="873" y="318">El huerto</text></svg>`,
idea:`<svg viewBox="0 0 1060 478">${teacher(214,196,1,'think')}${sheet(403,159,296,229)}<text class="small" x="434" y="204">Al final de la semana,</text><text class="label" x="434" y="245">revisan sus registros</text><text class="label" x="434" y="279">y acuerdan qué necesita</text><text class="label" x="434" y="313">cada planta.</text><path class="draw blue lineDraw" d="M718 273h78m-16-15 16 15-16 15"/><ellipse class="softblue" cx="882" cy="272" rx="87" ry="72"/><text class="small blueText" text-anchor="middle" x="882" y="247">¿Qué idea</text><text class="small blueText" text-anchor="middle" x="882" y="270">lo explica?</text><text class="small" text-anchor="middle" x="882" y="301">Turnos + registros</text><text class="small" text-anchor="middle" x="882" y="323">ayudan a cuidarlo</text></svg>`,
questions:`<svg viewBox="0 0 1060 478">${teacher(213,196,1,'open')}${book(417,221,164,126)}<g class="pop"><circle class="softblue" cx="670" cy="187" r="34"/><text class="small blueText" text-anchor="middle" x="670" y="192">tierra</text></g><g class="pop late"><circle class="gold" cx="774" cy="267" r="38"/><text class="small" text-anchor="middle" x="774" y="272">cambios</text></g><g class="pop later"><circle class="coral" cx="671" cy="346" r="38"/><text class="small" text-anchor="middle" x="671" y="351">acuerdo</text></g><path class="draw thin lineDraw" d="M584 234q32-36 54-43m-49 62q35 7 55 14m-58 28q26 34 53 43"/><text class="small blueText" x="842" y="224">Tres detalles</text><text class="small" x="842" y="250">que sí dice el texto.</text></svg>`,
find:`<svg viewBox="0 0 1060 478">${teacher(220,197,1,'think')}${sheet(420,163,238,212)}<text class="small" x="449" y="215">Los equipos cuidan</text><text class="label" x="449" y="254">las plantas por turnos.</text><text class="small" x="449" y="293">Registran cada cambio.</text><circle class="softblue" cx="775" cy="265" r="66"/><circle class="draw blue lineDraw" cx="775" cy="265" r="49"/><path class="draw blue lineDraw" d="M820 312l42 43"/><text class="small blueText" text-anchor="middle" x="775" y="260">por turnos</text><text class="small blueText" text-anchor="middle" x="775" y="281">registran</text></svg>`,
check:`<svg viewBox="0 0 1060 478">${teacher(253,190,1,'check')}${sheet(460,142,259,256)}<path class="draw blue lineDraw" d="M494 213l9 10 18-21m-27 70 9 10 18-21m-27 70 9 10 18-21"/><text class="label" x="545" y="220">Una idea clara</text><text class="label" x="545" y="290">Respuestas en el texto</text><text class="label" x="545" y="360">Nivel adecuado</text><path class="draw blue lineDraw late" d="M783 260l22 24 50-62"/><text class="small" x="776" y="326">revisar también es enseñar</text></svg>`,
edit:`<svg viewBox="0 0 1060 478">${teacher(230,194,1,'write')}${sheet(420,158,260,224)}<circle class="coral" cx="456" cy="232" r="15"/><path class="draw blue lineDraw" d="M449 225l14 14m0-14-14 14"/><text class="label" x="482" y="239">¿Qué inventas?</text><path class="draw blue lineDraw" d="M709 267h88m-17-15 17 15-17 15"/><circle class="softblue" cx="870" cy="267" r="70"/><path class="draw blue lineDraw" d="M840 267l19 19 40-48"/><text class="small blueText" text-anchor="middle" x="870" y="357">¿Qué dice el texto?</text></svg>`,
privacy:`<svg viewBox="0 0 1060 478">${teacher(260,193,1,'think')}${sheet(480,153,208,240)}<path class="draw blue lineDraw" d="M533 228l28 21 55-66m-83 87h90"/><text class="small blueText" x="521" y="319">sin nombres</text><g class="pop"><rect class="coral" x="748" y="181" width="132" height="91" rx="8"/><text class="label" text-anchor="middle" x="814" y="221">Nombres</text><text class="small" text-anchor="middle" x="814" y="249">y notas</text><path class="draw blue lineDraw" d="M755 273l117-91"/></g><text class="small" x="741" y="313">de estudiantes, no</text><text class="small" x="741" y="336">se comparten.</text></svg>`,
skill:`<svg viewBox="0 0 1060 478">${teacher(247,194,1,'think')}<circle class="softblue" cx="566" cy="260" r="90"/><text class="large blueText" text-anchor="middle" x="566" y="268">tema</text><path class="draw blue lineDraw" d="M675 260h93m-17-15 17 15-17 15"/><circle class="gold" cx="875" cy="260" r="98"/><text class="small" text-anchor="middle" x="875" y="249">idea</text><text class="small" text-anchor="middle" x="875" y="274">principal</text></svg>`,
start:`<svg viewBox="0 0 1060 478">${teacher(235,193,1,'write')}<path class="draw lineDraw" d="M429 252h424m-17-15 17 15-17 15"/><g class="pop"><circle class="softblue" cx="474" cy="252" r="54"/><text class="small blueText" text-anchor="middle" x="474" y="258">curso</text></g><g class="pop late"><circle class="gold" cx="640" cy="252" r="54"/><text class="small" text-anchor="middle" x="640" y="258">meta</text></g><g class="pop later"><circle class="coral" cx="808" cy="252" r="54"/><text class="small" text-anchor="middle" x="808" y="258">formato</text></g><path class="draw thin lineDraw" d="M469 340h338"/><text class="small" text-anchor="middle" x="638" y="371">lee y ajusta</text></svg>`,
close:`<svg viewBox="0 0 1060 478">${teacher(337,194,1,'open')}<g class="float"><circle class="softblue" cx="633" cy="177" r="37"/><text class="small blueText" text-anchor="middle" x="633" y="183">describe</text><circle class="gold" cx="760" cy="280" r="37"/><text class="small" text-anchor="middle" x="760" y="286">revisa</text><circle class="coral" cx="633" cy="382" r="37"/><text class="small" text-anchor="middle" x="633" y="388">ajusta</text></g><path class="draw blue lineDraw" d="M668 199q76 9 75 45m-1 72q-1 37-71 52m-72-54q-4-52 67-67"/><text class="large" x="833" y="266">Tú decides</text><text class="small" x="833" y="295">qué llega al aula.</text></svg>`
};
let current=-1;
window.renderAt=(time)=>{const idx=beats.reduce((found,b,i)=>time>=b.at?i:found,-1);if(idx<0)return;if(idx!==current){current=idx;const b=beats[idx],f=document.getElementById('frame');f.classList.remove('active');document.getElementById('title').textContent=b.title;document.getElementById('eyebrow').textContent=b.eyebrow||'';document.getElementById('stage').innerHTML=scenes[b.art];document.getElementById('curriculum').textContent=b.code||'';document.getElementById('count').textContent=`${String(idx+1).padStart(2,'0')} / ${String(beats.length).padStart(2,'0')}`;requestAnimationFrame(()=>f.classList.add('active'));}const line=boundaries.find(x=>time>=x.offset&&time<x.offset+x.duration);document.getElementById('caption').textContent=line?.text||'';document.getElementById('progress').style.width=`${time/duration*100}%`;};window.renderAt(0);
</script>
</body>
</html>
