<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>ILIA · Para el lunes</title><link rel="stylesheet" href="scene-kit.css"></head>
<body>
<header><b>ILIA</b>Que use tu libro · Para el lunes</header>

<section data-scene="tarea" style="flex-direction: column; gap: 20px; align-items: flex-start; padding-left: 220px;">
  <div class="kicker" data-in="0.1">Para el lunes</div>
  <div class="big" style="font-size: 32px" data-in="0.6">1. Una página de tu libro</div>
  <div class="big" style="font-size: 32px" data-in="4.2">2. Pásasela a Gemini</div>
  <div class="big" style="font-size: 32px; color: var(--blue)" data-in="5.8">3. Revisa con la página al lado</div>
</section>

<section data-scene="sigue">
  <div class="col" data-in="1.6"><div class="chip strike" data-strike="3.4" style="font-size: 26px;">Un tema</div><p style="color: var(--muted)">antes</p></div>
  <div class="mark" style="color: var(--blue)" data-in="3.8">→</div>
  <div class="col" data-in="4.2"><div class="chip blue" style="font-size: 26px;">La destreza que trabajas</div><p style="color: var(--blue)">la próxima semana</p></div>
</section>

<div class="progress"><i></i></div>
<script src="scene-kit.js"></script>
</body>
</html>
