<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>ILIA · Para el lunes</title><link rel="stylesheet" href="scene-kit.css"></head>
<body>
<header><b>ILIA</b>Empezar por la destreza · Para el lunes</header>
<section data-scene="tarea" style="flex-direction: column; gap: 20px; align-items: flex-start; padding-left: 220px;">
  <div class="kicker" data-in="0.1">Para el lunes</div>
  <div class="big" style="font-size: 32px" data-in="0.8">1. Una destreza de tu planificación</div>
  <div class="big" style="font-size: 32px" data-in="4.6">2. Pídele a Gemini tres evidencias</div>
  <div class="big" style="font-size: 32px" data-in="6.6">3. Elige una</div>
  <div class="big" style="font-size: 32px; color: var(--blue)" data-in="7.6">4. Arma la clase para llegar ahí</div>
</section>
<section data-scene="sigue">
  <div class="col" data-in="1.2"><div class="page" style="height: 220px;"><h4>Una página</h4><div class="bar"></div><div class="bar" style="width: 70%"></div></div><p style="color: var(--muted)">hasta ahora</p></div>
  <div class="mark" style="color: var(--blue)" data-in="2.8">→</div>
  <div class="col" data-in="3.2"><div class="page" style="height: 300px;"><h4>Tu unidad entera</h4><div class="bar"></div><div class="bar"></div><div class="bar" style="width: 80%"></div><div class="bar"></div><div class="bar" style="width: 65%"></div></div><p style="color: var(--blue)">la próxima semana</p></div>
</section>
<div class="progress"><i></i></div>
<script src="scene-kit.js"></script>
</body>
</html>
