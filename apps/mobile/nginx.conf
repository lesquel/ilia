server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # These belong in a file included by every location. nginx does not inherit
    # `add_header` into a location that defines its own, so setting them once at
    # server level silently loses them wherever caching headers are set —
    # which is exactly where index.html is served.
    include /etc/nginx/security-headers.conf;

    # expo-router's development route listing. Useful while building, and a map
    # of the whole application to anyone who asks for it in production.
    location = /_sitemap.html {
        return 404;
    }

    # expo-router produces real URLs, so reloading /catalog/algo must serve the
    # app rather than 404. Without this every deep link breaks on refresh — and
    # a deep link is exactly what someone shares.
    location / {
        include /etc/nginx/security-headers.conf;
        # Falls through to index.html, and answers 200 for a URL that matches no
        # page. That is deliberate, and it was measured: dynamic routes export
        # as files with literal brackets (`catalog/[slug].html`), so nginx
        # cannot tell `/catalog/prompting-para-docentes` — a real course — from
        # a typo. Returning a true 404 here breaks every course link, which is
        # exactly the link people share. The client owns not-found, and renders
        # it; only the status code is imprecise.
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached hard. index.html cannot: it is
    # what points at the new hashes after a deploy.
    location /_expo/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
