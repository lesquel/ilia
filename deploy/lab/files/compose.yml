# Laptop 5: object storage (MinIO). Run from this directory:
#   docker compose --env-file ../lab.env up -d
services:
  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${ILIA_STORAGE_ACCESS_KEY:?set ILIA_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ILIA_STORAGE_SECRET_KEY:?set ILIA_STORAGE_SECRET_KEY}
    volumes:
      - ilia-minio-data:/data
    ports:
      # Signed URLs point browsers straight at this host, so both ports are
      # published on the LAN.
      - '9000:9000'
      - '9001:9001'
    # No HEALTHCHECK: the image has no curl/mc. `minio-init` retries instead.
    restart: unless-stopped

  # One-shot: creates the private bucket and its CORS rules, then exits.
  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ENDPOINT: http://minio:9000
      ILIA_STORAGE_ACCESS_KEY: ${ILIA_STORAGE_ACCESS_KEY:?set ILIA_STORAGE_ACCESS_KEY}
      ILIA_STORAGE_SECRET_KEY: ${ILIA_STORAGE_SECRET_KEY:?set ILIA_STORAGE_SECRET_KEY}
      ILIA_STORAGE_BUCKET: ${ILIA_STORAGE_BUCKET:-ilia}
    volumes:
      # Reuse the pilot's script so the bucket policy stays identical.
      - ../../minio/init-bucket.sh:/init/init-bucket.sh:ro
    entrypoint: ['/bin/sh', '/init/init-bucket.sh']
    depends_on:
      - minio
    restart: 'no'

volumes:
  ilia-minio-data:
