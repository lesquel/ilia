# Single entry point for the pilot: web + API on one host.
#
# The browser talks to this host only. Cookies are host-only
# (`ILIA_COOKIE_DOMAIN` empty). The API path prefix is the real one
# (`/api/v1/...`); `/health` stays unprefixed because that is how the
# process answers readiness.

upstream ilia_api {
    server api:8000;
}

upstream ilia_web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    # Do not buffer uploads that the SPA posts to the API (lab prompts,
    # instructor forms). Default buffering holds the body in the proxy
    # and hides back-pressure from the client.
    client_max_body_size 4m;

    location /api/ {
        proxy_pass http://ilia_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Auth cookies must round-trip; do not strip Cookie.
        proxy_pass_header Set-Cookie;
    }

    location /health {
        proxy_pass http://ilia_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # OpenAPI only when someone is debugging the pilot box. Not linked
    # from the product UI.
    location /docs {
        proxy_pass http://ilia_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://ilia_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ilia_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
