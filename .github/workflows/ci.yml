name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Repository tests run against a real PostgreSQL (TRD 13). Faking the
    # database would test the fake, not the constraints that actually hold.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ilia
          POSTGRES_PASSWORD: ilia
          POSTGRES_DB: ilia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilia -d ilia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Only the test variable is set job-wide. `ILIA_DATABASE_URL` is scoped to
    # the migration step alone: `Settings` reads it from the environment, so
    # exporting it here would stop the unit tests from being hermetic.
    env:
      # A separate database from the one migrations run against. The suite
      # TRUNCATEs its tables in teardown, so sharing one would mean `pytest`
      # wipes whatever else is in there.
      ILIA_TEST_DATABASE_URL: postgresql+asyncpg://ilia:ilia@localhost:5432/ilia_test

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Create the test database
        run: |
          PGPASSWORD=ilia psql -h localhost -U ilia -d ilia -c 'CREATE DATABASE ilia_test'

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app

      # Proves the migrations actually apply to an empty database, which is the
      # only thing a deploy will ever do with them.
      - name: Apply migrations
        run: uv run alembic upgrade head
        env:
          ILIA_DATABASE_URL: postgresql+asyncpg://ilia:ilia@localhost:5432/ilia

      - name: Test
        run: uv run pytest

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The domain layer is pure by design, so it runs here in milliseconds
      # without a native test environment.
      - name: Unit tests
        run: npm test

      # Bundling the web target is what actually catches a broken import or a
      # native-only module leaking into shared code. Typecheck alone does not.
      - name: Build web
        run: npx expo export --platform web --output-dir .web-build
