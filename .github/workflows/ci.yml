name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Repository tests run against a real PostgreSQL (TRD 13). Faking the
    # database would test the fake, not the constraints that actually hold.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ilia
          POSTGRES_PASSWORD: ilia
          POSTGRES_DB: ilia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilia -d ilia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Only the test variable is set job-wide. `ILIA_DATABASE_URL` is scoped to
    # the migration step alone: `Settings` reads it from the environment, so
    # exporting it here would stop the unit tests from being hermetic.
    env:
      # A separate database from the one migrations run against. The suite
      # TRUNCATEs its tables in teardown, so sharing one would mean `pytest`
      # wipes whatever else is in there.
      ILIA_TEST_DATABASE_URL: postgresql+asyncpg://ilia:ilia@localhost:5432/ilia_test

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Create the test database
        run: |
          PGPASSWORD=ilia psql -h localhost -U ilia -d ilia -c 'CREATE DATABASE ilia_test'

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app

      # Proves the migrations actually apply to an empty database, which is the
      # only thing a deploy will ever do with them.
      - name: Apply migrations
        run: uv run alembic upgrade head
        env:
          ILIA_DATABASE_URL: postgresql+asyncpg://ilia:ilia@localhost:5432/ilia

      - name: Test
        run: uv run pytest

  # Reference EVAL baseline for the prompting lab (TRD §13). Skips when LLM
  # secrets are absent so CI stays green; fails if secrets exist but the stub
  # would still grade.
  eval-reference:
    name: EVAL reference baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Reference prompting lab scores
        env:
          ILIA_EVAL_REFERENCE: "1"
          ILIA_LLM_PROVIDER: ${{ secrets.ILIA_LLM_PROVIDER }}
          ILIA_LLM_API_KEY: ${{ secrets.ILIA_LLM_API_KEY }}
          ILIA_LLM_MODEL: ${{ secrets.ILIA_LLM_MODEL }}
        run: uv run pytest tests/test_eval_gold_reference.py -v --tb=short

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The domain layer is pure by design, so it runs here in milliseconds
      # without a native test environment.
      - name: Unit tests
        run: npm test

      # Bundling the web target is what actually catches a broken import or a
      # native-only module leaking into shared code. Typecheck alone does not.
      - name: Build web
        run: npx expo export --platform web --output-dir .web-build

  # The images are part of the product: a Dockerfile nobody builds is a
  # Dockerfile that stops working, and it stops working on the day somebody
  # needs to deploy in a hurry.
  images:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          # Not pushed: this job exists to catch a broken build, and publishing
          # is a release decision, not a CI one.
          push: false
          load: true
          tags: ilia-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/mobile
          push: false
          load: true
          tags: ilia-web:ci
          build-args: |
            EXPO_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles. Starting proves it runs — which is a
      # different thing, and the one that caught a crash on boot.
      - name: The API image starts and answers
        run: |
          docker run -d --name api-smoke -p 8000:8000 \
            -e ILIA_JWT_SECRET=ci-secret-long-enough-for-hmac-sha256 \
            --read-only --tmpfs /tmp \
            ilia-api:ci
          for attempt in $(seq 1 20); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "The API answered on attempt $attempt."
              exit 0
            fi
            sleep 2
          done
          echo "The API never answered. Logs:"
          docker logs api-smoke
          exit 1

      - name: The web image serves a deep link
        run: |
          docker run -d --name web-smoke -p 8090:80 ilia-web:ci
          for attempt in $(seq 1 15); do
            # A course URL, not the root: reloading a shared link is the case
            # that breaks when the SPA fallback is wrong.
            if curl -fs http://localhost:8090/catalog/algo > /dev/null; then
              echo "The web image served a deep link on attempt $attempt."
              exit 0
            fi
            sleep 2
          done
          echo "The web image never answered. Logs:"
          docker logs web-smoke
          exit 1
