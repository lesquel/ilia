document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ly: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"25d0c17b-83ff-47b5-b3c7-b2c4b0c7c624\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"280be4ee-5df8-49e8-bec5-0651152171fe\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b86d868c-7ba2-454c-bf8d-467b2967cedc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f80f1a8c-1627-4630-9a68-827867a3f943\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8499c8f2-219d-4aac-9dd0-4d4c1a2008da\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"b581b223-016f-40ad-a0e1-adc86884c9ff\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"4be1333d-0cdc-4b5a-a49e-0f31efbbc6f2\"><\u002Fscript>\n<script src=\"b924b6dd-f9b6-41d7-a9b3-8356eb815960\"><\u002Fscript>\n<script>\n(function(){\n  var m = document.querySelector('meta[name=\"ext-resource-dependency\"][data-resource-id=\"photo\"]');\n  var apply = function(){\n    var u = (window.__resources && window.__resources.photo) || (m && m.getAttribute('content'));\n    if (!u) return;\n    document.querySelectorAll('image-slot').forEach(function(el){\n      if (el.getAttribute('src') !== u) el.setAttribute('src', u);\n    });\n  };\n  apply();\n  new MutationObserver(apply).observe(document.documentElement, {childList:true, subtree:true});\n})();\n<\u002Fscript>\n<style>\nbody{margin:0;background:#f2f2f3}\n[data-theme=\"dark\"]{\n  --color-bg:#15181b;--color-surface:#1d2126;--color-text:#e8eaec;\n  --color-divider:color-mix(in srgb,#e8eaec 18%,transparent);\n  --color-accent:#7ea6cd;\n  --color-neutral-100:#22262b;--color-neutral-200:#2b3036;--color-neutral-800:#c9ced3;\n  --color-accent-100:#1f2c39;--color-accent-200:#26384a;--color-accent-800:#bcd6ef;\n  --color-accent-2-100:#1f2c39;--color-accent-2-800:#bcd6ef;\n}\n@keyframes shimmer{0%{background-position:-380px 0}100%{background-position:380px 0}}\n@keyframes spin{to{transform:rotate(360deg)}}\n@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n.rroot{container-type:inline-size;container-name:app}\nimage-slot{display:block;width:100%;height:100%}\n@container app (max-width:1080px){\n  .g3,.g4{grid-template-columns:1fr 1fr!important}\n  .split,.hero{grid-template-columns:1fr!important}\n  .learn{grid-template-columns:1fr!important}\n  .learnside{display:none!important}\n  .learnnav{border-right:0!important;border-bottom:1px solid var(--color-divider)!important;height:auto!important}\n}\n@container app (max-width:760px){\n  .g2,.g3,.g4,.g5{grid-template-columns:1fr!important}\n  .shell{grid-template-columns:1fr!important}\n  .shell>aside{display:none!important}\n  .mobnav{display:grid!important}\n  .shell>main{padding-bottom:76px!important}\n  h1{font-size:38px!important}\n  h2{font-size:26px!important}\n  .pad{padding-left:18px!important;padding-right:18px!important}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-theme=\"{{ theme }}\" style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)\">\n\n  <div style=\"position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--color-neutral-900);color:#f2f2f3;overflow-x:auto\">\n    <span style=\"font-family:var(--font-heading);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;white-space:nowrap\">Prototipo<\u002Fspan>\n    <div style=\"display:flex;gap:6px\">\n      <sc-for list=\"{{ screens }}\" as=\"s\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.chipStyle }}\">{{ s.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;gap:6px;flex:none\">\n      <sc-for list=\"{{ viewports }}\" as=\"v\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ v.go }}\" style=\"{{ v.style }}\">{{ v.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"flex:none;display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.28);color:#f2f2f3;font-family:var(--font-heading);font-size:12px;padding:5px 10px;cursor:pointer\">{{ themeLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"rroot\" style=\"{{ frameStyle }}\">\n\n  <!-- ══ LANDING ══ -->\n  <sc-if value=\"{{ scLanding }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div class=\"nav\" style=\"max-width:1280px;margin:0 auto;padding:20px 40px;gap:28px\">\n        <span class=\"nav-brand\" style=\"letter-spacing:.02em\">PRAXIS<span style=\"color:var(--color-accent)\">.AI<\u002Fspan><\u002Fspan>\n        <a href=\"#\" sc-camel-on-click=\"{{ goCatalogo }}\">Cursos<\u002Fa>\n        <a href=\"#\">Cómo funciona<\u002Fa>\n        <a href=\"#\">Para docentes<\u002Fa>\n        <a href=\"#\">Sobre nosotros<\u002Fa>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goLogin }}\">Iniciar sesión<\u002Fbutton>\n        <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ goRegistro }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Registrarse<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"hero pad\" style=\"max-width:1280px;margin:0 auto;padding:48px 40px 72px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center\">\n        <div>\n          <div style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--font-heading);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent);border:1px solid var(--color-divider);padding:4px 10px;margin-bottom:22px\">Laboratorio práctico de IA<\u002Fdiv>\n          <h1 style=\"font-size:70px;line-height:.98;margin:0 0 20px;letter-spacing:-.02em;text-wrap:balance\">Aprende Inteligencia Artificial haciendo<\u002Fh1>\n          <p style=\"font-size:18px;line-height:1.5;max-width:52ch;opacity:.75;margin-bottom:28px;text-wrap:pretty\">Domina nuevas herramientas y tecnologías de IA mediante cursos prácticos, actividades y evaluaciones demostrativas.<\u002Fp>\n          <div style=\"display:flex;gap:12px\">\n            <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ goCatalogo }}\" style=\"padding:11px 22px;font-size:16px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Explorar cursos<\u002Fbutton>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goRegistro }}\" style=\"padding:11px 22px;font-size:16px\">Comenzar ahora<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:40px;margin-top:44px;padding-top:22px;border-top:1px solid var(--color-divider)\">\n            <div><div style=\"font-family:var(--font-heading);font-size:30px;line-height:1\">6.400+<\u002Fdiv><div style=\"font-size:12px;opacity:.55\">estudiantes<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:var(--font-heading);font-size:30px;line-height:1\">28<\u002Fdiv><div style=\"font-size:12px;opacity:.55\">cursos prácticos<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:var(--font-heading);font-size:30px;line-height:1\">91%<\u002Fdiv><div style=\"font-size:12px;opacity:.55\">finalización<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"blueprint\" style=\"padding:16px;background:var(--color-surface)\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"display:flex;align-items:center;gap:8px;font-family:var(--font-heading);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:12px\">\n            <span style=\"width:7px;height:7px;background:var(--color-accent);display:block\"><\u002Fspan>Laboratorio generativo — sesión 04\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:12px;font-size:13px;line-height:1.5;background:var(--color-bg)\">\n            <span style=\"opacity:.5\">prompt&nbsp;▸&nbsp;<\u002Fspan>ciudad futurista sostenible, torres con vegetación integrada, luz de amanecer, plano general, estilo fotorrealista\n          <\u002Fdiv>\n          <div class=\"blueprint duotone\" style=\"margin-top:14px;aspect-ratio:16/10;background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 10px,var(--color-accent-100) 10px 20px)\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <image-slot src=\"2c5af0b1-d849-4777-998e-242b83498b71\" id=\"hero-gen\" shape=\"rect\" placeholder=\"Imagen generada\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px\">\n            <div style=\"border:1px solid var(--color-divider);padding:8px\"><div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.5\">Cumpl.<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:20px\">95<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid var(--color-divider);padding:8px\"><div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.5\">Prompt<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:20px\">82<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid var(--color-divider);padding:8px\"><div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.5\">Creat.<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:20px\">90<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid var(--color-divider);padding:8px;background:var(--color-accent);color:var(--color-bg)\"><div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.8\">Total<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:20px\">87<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\">\n        <div style=\"max-width:1280px;margin:0 auto;padding:56px 40px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px\">\n            <h2 style=\"margin:0\">Cursos destacados<\u002Fh2>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goCatalogo }}\">Ver todos →<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"g3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n            <sc-for list=\"{{ destacados }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div class=\"card blueprint\" style=\"padding:0;gap:0\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <div class=\"duotone\" style=\"aspect-ratio:16/9;border-bottom:1px solid var(--color-divider);background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 10px,var(--color-accent-100) 10px 20px)\"><image-slot src=\"2c5af0b1-d849-4777-998e-242b83498b71\" id=\"{{ c.slot }}\" shape=\"rect\" placeholder=\"Imagen del curso\"><\u002Fimage-slot><\u002Fdiv>\n                <div style=\"padding:16px;display:flex;flex-direction:column;gap:9px;flex:1\">\n                  <div class=\"card-kicker\">{{ c.categoria }}<\u002Fdiv>\n                  <div class=\"card-title\">{{ c.nombre }}<\u002Fdiv>\n                  <p class=\"card-body\">{{ c.desc }}<\u002Fp>\n                  <div class=\"card-meta\" style=\"gap:10px\"><span>{{ c.nivel }}<\u002Fspan><span>·<\u002Fspan><span>{{ c.duracion }}<\u002Fspan><span>·<\u002Fspan><span>{{ c.estudiantes }} est.<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--color-divider)\">\n                    <span style=\"font-size:12px;opacity:.7\">{{ c.docente }}<\u002Fspan>\n                    <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ c.go }}\" style=\"font-size:13px\">Ver curso<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"max-width:1280px;margin:0 auto;padding:64px 40px\">\n        <h2 style=\"margin:0 0 8px\">Aprende haciendo<\u002Fh2>\n        <p style=\"opacity:.7;max-width:60ch;margin-bottom:32px\">Los cursos no se quedan en la teoría. Cada módulo termina en una actividad ejecutable y cada curso en una evaluación demostrativa que se corrige de forma automática.<\u002Fp>\n        <div class=\"g3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--color-divider)\">\n          <div style=\"padding:28px;border-right:1px solid var(--color-divider)\">\n            <div style=\"font-family:var(--font-heading);font-size:44px;line-height:1;color:var(--color-accent)\">01<\u002Fdiv>\n            <h4 style=\"margin:12px 0 6px\">Aprende<\u002Fh4>\n            <p style=\"font-size:14px;opacity:.7;margin:0\">Lecciones en vídeo, presentaciones y documentos descargables, organizados en módulos cortos.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:28px;border-right:1px solid var(--color-divider)\">\n            <div style=\"font-family:var(--font-heading);font-size:44px;line-height:1;color:var(--color-accent)\">02<\u002Fdiv>\n            <h4 style=\"margin:12px 0 6px\">Practica<\u002Fh4>\n            <p style=\"font-size:14px;opacity:.7;margin:0\">Actividades, preguntas con explicación y foros donde contrastar tus resultados con los del grupo.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:28px\">\n            <div style=\"font-family:var(--font-heading);font-size:44px;line-height:1;color:var(--color-accent)\">03<\u002Fdiv>\n            <h4 style=\"margin:12px 0 6px\">Demuestra<\u002Fh4>\n            <p style=\"font-size:14px;opacity:.7;margin:0\">Una evaluación práctica en el laboratorio: escribes el prompt, generas y recibes puntuación y feedback.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid var(--color-divider);background:var(--color-accent-900)\">\n        <div style=\"max-width:1280px;margin:0 auto;padding:56px 40px;color:#f2f2f3\">\n          <h2 style=\"margin:0 0 26px;color:#f2f2f3\">Qué incluye la plataforma<\u002Fh2>\n          <div class=\"g3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.18)\">\n            <sc-for list=\"{{ features }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <div style=\"background:var(--color-accent-900);padding:22px\">\n                <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55\">{{ f.num }}<\u002Fdiv>\n                <h4 style=\"margin:8px 0 6px;color:#f2f2f3\">{{ f.t }}<\u002Fh4>\n                <p style=\"font-size:13px;margin:0;opacity:.7\">{{ f.d }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ LOGIN ══ -->\n  <sc-if value=\"{{ scLogin }}\">\n    <div class=\"split\" style=\"display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 41px)\">\n      <div style=\"display:grid;place-items:center;padding:48px\">\n        <div style=\"width:100%;max-width:380px\">\n          <div style=\"font-family:var(--font-heading);font-weight:600;font-size:20px;margin-bottom:36px\">PRAXIS<span style=\"color:var(--color-accent)\">.AI<\u002Fspan><\u002Fdiv>\n          <h2 style=\"margin:0 0 6px\">Iniciar sesión<\u002Fh2>\n          <p style=\"font-size:14px;opacity:.65;margin-bottom:26px\">Accede para continuar con tus cursos.<\u002Fp>\n          <div class=\"field\" style=\"margin-bottom:14px\"><label>Email<\u002Flabel><input class=\"input\" type=\"email\" value=\"miquel@praxis.ai\" readonly=\"\"><\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:14px\"><label>Contraseña<\u002Flabel><input class=\"input\" type=\"password\" value=\"············\" readonly=\"\"><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;font-size:13px\">\n            <label class=\"radio\"><input type=\"checkbox\"><span class=\"dot\" style=\"border-radius:0\"><\u002Fspan>Recordarme<\u002Flabel>\n            <a href=\"#\">¿Olvidaste tu contraseña?<\u002Fa>\n          <\u002Fdiv>\n          <button class=\"btn btn-primary btn-block blueprint\" sc-camel-on-click=\"{{ goDashboard }}\" style=\"padding:11px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Iniciar sesión<\u002Fbutton>\n          <div style=\"display:flex;align-items:center;gap:12px;margin:22px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.45\">\n            <span style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fspan>o continúa con<span style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n            <button class=\"btn btn-secondary\">Google<\u002Fbutton>\n            <button class=\"btn btn-secondary\">GitHub<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"text-align:center;font-size:13px;margin-top:26px;opacity:.7\">¿No tienes cuenta? <a href=\"#\" sc-camel-on-click=\"{{ goRegistro }}\">Registrarse<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"duotone\" style=\"background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 14px,var(--color-accent-100) 14px 28px);border-left:1px solid var(--color-divider);display:grid;place-items:center;padding:48px\">\n        <div style=\"max-width:360px\">\n          <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-800);margin-bottom:12px\">Laboratorio de IA<\u002Fdiv>\n          <p style=\"font-family:var(--font-heading);font-size:30px;line-height:1.12;color:var(--color-accent-900);margin:0\">Escribe un prompt, ejecútalo, recibe una evaluación en segundos.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ REGISTRO ══ -->\n  <sc-if value=\"{{ scRegistro }}\">\n    <div style=\"display:grid;place-items:center;padding:64px 24px\">\n      <div class=\"blueprint\" style=\"width:100%;max-width:480px;padding:34px;background:var(--color-surface)\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading);font-weight:600;font-size:20px;margin-bottom:24px\">PRAXIS<span style=\"color:var(--color-accent)\">.AI<\u002Fspan><\u002Fdiv>\n        <h2 style=\"margin:0 0 6px\">Crear cuenta<\u002Fh2>\n        <p style=\"font-size:14px;opacity:.65;margin-bottom:24px\">Empieza gratis. Sin tarjeta.<\u002Fp>\n        <div class=\"g2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px\">\n          <div class=\"field\"><label>Nombre<\u002Flabel><input class=\"input\" placeholder=\"Miquel\"><\u002Fdiv>\n          <div class=\"field\"><label>Apellido<\u002Flabel><input class=\"input\" placeholder=\"Torrent\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:14px\"><label>Email<\u002Flabel><input class=\"input\" placeholder=\"tu@email.com\"><\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:6px\"><label>Contraseña<\u002Flabel><input class=\"input\" type=\"password\" placeholder=\"Mínimo 8 caracteres\"><\u002Fdiv>\n        <div style=\"display:flex;gap:4px;margin-bottom:14px\">\n          <span style=\"flex:1;height:3px;background:var(--color-accent)\"><\u002Fspan>\n          <span style=\"flex:1;height:3px;background:var(--color-accent)\"><\u002Fspan>\n          <span style=\"flex:1;height:3px;background:var(--color-divider)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:8px\"><label>Confirmar contraseña<\u002Flabel><input class=\"input\" type=\"password\" placeholder=\"Repite la contraseña\"><\u002Fdiv>\n        <div style=\"font-size:12px;color:#b4553f;margin-bottom:18px\">Las contraseñas no coinciden.<\u002Fdiv>\n        <button class=\"btn btn-primary btn-block blueprint\" sc-camel-on-click=\"{{ goDashboard }}\" style=\"padding:11px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Crear cuenta<\u002Fbutton>\n        <p style=\"text-align:center;font-size:13px;margin:20px 0 0;opacity:.7\">¿Ya tienes cuenta? <a href=\"#\" sc-camel-on-click=\"{{ goLogin }}\">Iniciar sesión<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ CATÁLOGO ══ -->\n  <sc-if value=\"{{ scCatalogo }}\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:36px 40px 72px\">\n      <h2 style=\"margin:0 0 6px\">Explorar cursos<\u002Fh2>\n      <p style=\"opacity:.65;margin-bottom:24px\">28 cursos prácticos de inteligencia artificial.<\u002Fp>\n      <div class=\"split\" style=\"display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start\">\n        <div class=\"blueprint\" style=\"padding:18px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <input class=\"input\" placeholder=\"Buscar…\" style=\"margin-bottom:20px\">\n          <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:8px\">Categoría<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;margin-bottom:20px;font-size:14px\">\n            <label class=\"radio\"><input type=\"checkbox\" checked=\"\"><span class=\"dot\" style=\"border-radius:0\"><\u002Fspan>Imagen generativa<\u002Flabel>\n            <label class=\"radio\"><input type=\"checkbox\"><span class=\"dot\" style=\"border-radius:0\"><\u002Fspan>Texto y LLM<\u002Flabel>\n            <label class=\"radio\"><input type=\"checkbox\"><span class=\"dot\" style=\"border-radius:0\"><\u002Fspan>Agentes<\u002Flabel>\n            <label class=\"radio\"><input type=\"checkbox\"><span class=\"dot\" style=\"border-radius:0\"><\u002Fspan>Visión<\u002Flabel>\n            <label class=\"radio\"><input type=\"checkbox\"><span class=\"dot\" style=\"border-radius:0\"><\u002Fspan>Ética y gobernanza<\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:8px\">Nivel<\u002Fdiv>\n          <div class=\"seg\" style=\"flex-direction:column;align-items:stretch;margin-bottom:20px\">\n            <label class=\"seg-opt\" style=\"border-left:0\"><input type=\"radio\" name=\"niv\" checked=\"\">Todos<\u002Flabel>\n            <label class=\"seg-opt\" style=\"border-left:0;border-top:1px solid var(--color-divider)\"><input type=\"radio\" name=\"niv\">Principiante<\u002Flabel>\n            <label class=\"seg-opt\" style=\"border-left:0;border-top:1px solid var(--color-divider)\"><input type=\"radio\" name=\"niv\">Intermedio<\u002Flabel>\n            <label class=\"seg-opt\" style=\"border-left:0;border-top:1px solid var(--color-divider)\"><input type=\"radio\" name=\"niv\">Avanzado<\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:8px\">Duración<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;font-size:14px\">\n            <label class=\"radio\"><input type=\"radio\" name=\"dur\"><span class=\"dot\"><\u002Fspan>Menos de 5 h<\u002Flabel>\n            <label class=\"radio\"><input type=\"radio\" name=\"dur\"><span class=\"dot\"><\u002Fspan>5 – 10 h<\u002Flabel>\n            <label class=\"radio\"><input type=\"radio\" name=\"dur\"><span class=\"dot\"><\u002Fspan>Más de 10 h<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:18px\">\n            <span class=\"tag tag-accent\">Imagen generativa ✕<\u002Fspan>\n            <span style=\"font-size:13px;opacity:.55;margin-left:auto\">6 resultados · ordenar por relevancia<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"g3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n            <sc-for list=\"{{ cursos }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <div class=\"card blueprint\" style=\"padding:0;gap:0\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <div class=\"duotone\" style=\"aspect-ratio:16/9;border-bottom:1px solid var(--color-divider);background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 10px,var(--color-accent-100) 10px 20px)\"><image-slot src=\"2c5af0b1-d849-4777-998e-242b83498b71\" id=\"{{ c.slot }}\" shape=\"rect\" placeholder=\"Imagen del curso\"><\u002Fimage-slot><\u002Fdiv>\n                <div style=\"padding:16px;display:flex;flex-direction:column;gap:9px;flex:1\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:center\">\n                    <span class=\"card-kicker\">{{ c.categoria }}<\u002Fspan>\n                    <span style=\"font-size:12px;opacity:.6\">★ {{ c.rating }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"card-title\">{{ c.nombre }}<\u002Fdiv>\n                  <p class=\"card-body\">{{ c.desc }}<\u002Fp>\n                  <div class=\"card-meta\" style=\"gap:10px\"><span>{{ c.nivel }}<\u002Fspan><span>·<\u002Fspan><span>{{ c.duracion }}<\u002Fspan><span>·<\u002Fspan><span>{{ c.estudiantes }} est.<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--color-divider)\">\n                    <span style=\"font-size:12px;opacity:.7\">{{ c.docente }}<\u002Fspan>\n                    <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ c.go }}\" style=\"font-size:13px\">Ver curso<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ DETALLE DE CURSO ══ -->\n  <sc-if value=\"{{ scCurso }}\">\n    <div>\n      <div class=\"duotone\" style=\"position:relative;background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 14px,var(--color-accent-100) 14px 28px);border-bottom:1px solid var(--color-divider)\">\n        <div style=\"position:absolute;inset:0\"><image-slot src=\"2c5af0b1-d849-4777-998e-242b83498b71\" id=\"curso-banner\" shape=\"rect\" placeholder=\"Banner del curso\"><\u002Fimage-slot><\u002Fdiv>\n        <div style=\"position:absolute;inset:0;background:linear-gradient(90deg,var(--color-accent-900) 0%,color-mix(in srgb,var(--color-accent-900) 88%,transparent) 55%,color-mix(in srgb,var(--color-accent-900) 45%,transparent) 100%);pointer-events:none\"><\u002Fdiv>\n        <div class=\"pad\" style=\"position:relative;max-width:1180px;margin:0 auto;padding:44px 40px;pointer-events:none\">\n          <div style=\"font-size:12px;color:rgba(242,242,243,.8);margin-bottom:14px;pointer-events:auto\"><a href=\"#\" sc-camel-on-click=\"{{ goCatalogo }}\" style=\"color:#f2f2f3\">Cursos<\u002Fa> / Imagen generativa<\u002Fdiv>\n          <h1 style=\"margin:0 0 10px;font-size:52px;max-width:20ch;color:#f2f2f3\">Creación de imágenes con IA<\u002Fh1>\n          <p style=\"max-width:62ch;color:rgba(242,242,243,.85);margin-bottom:20px\">Aprende a diseñar imágenes utilizando modelos generativos y técnicas de prompting.<\u002Fp>\n          <div style=\"display:flex;gap:22px;font-size:13px;color:rgba(242,242,243,.85);flex-wrap:wrap\">\n            <span>Elena Ruiz<\u002Fspan><span>8 h<\u002Fspan><span>Intermedio<\u002Fspan><span>1.240 estudiantes<\u002Fspan><span>5 módulos<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"split pad\" style=\"max-width:1180px;margin:0 auto;padding:32px 40px 72px;display:grid;grid-template-columns:1fr 320px;gap:44px;align-items:start\">\n        <div>\n          <div style=\"display:flex;gap:26px;border-bottom:1px solid var(--color-divider);margin-bottom:24px\">\n            <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ tabDesc }}\">\n            <div>\n              <h4 style=\"margin-top:0\">Sobre este curso<\u002Fh4>\n              <p style=\"opacity:.78\">Un recorrido práctico por los modelos de difusión y las técnicas de prompting que se usan hoy en producción. Cada módulo termina con una actividad ejecutable, y el curso cierra con una evaluación demostrativa en el laboratorio: generas una imagen a partir de un enunciado y el sistema puntúa cumplimiento, calidad del prompt, coherencia y composición.<\u002Fp>\n              <h4 style=\"margin-top:26px\">Qué vas a poder hacer<\u002Fh4>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;font-size:14px;opacity:.8\">\n                <div>— Estructurar un prompt en sujeto, estilo, luz y composición<\u002Fdiv>\n                <div>— Controlar la coherencia entre varias generaciones<\u002Fdiv>\n                <div>— Elegir el modelo adecuado para cada encargo<\u002Fdiv>\n                <div>— Iterar sobre un resultado con variaciones dirigidas<\u002Fdiv>\n                <div>— Documentar y versionar tus prompts<\u002Fdiv>\n                <div>— Evaluar críticamente una imagen generada<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ tabContenido }}\">\n            <div style=\"border:1px solid var(--color-divider)\">\n              <sc-for list=\"{{ modulos }}\" as=\"m\" hint-placeholder-count=\"5\">\n                <div style=\"{{ m.wrapStyle }}\">\n                  <button sc-camel-on-click=\"{{ m.toggle }}\" style=\"width:100%;display:flex;align-items:center;gap:14px;background:transparent;border:0;padding:16px 18px;cursor:pointer;color:inherit;text-align:left;font-family:var(--font-body)\">\n                    <span style=\"font-family:var(--font-heading);font-size:12px;letter-spacing:.1em;color:var(--color-accent);width:24px\">{{ m.num }}<\u002Fspan>\n                    <span style=\"font-family:var(--font-heading);font-size:18px;flex:1\">{{ m.titulo }}<\u002Fspan>\n                    <span style=\"font-size:12px;opacity:.5\">{{ m.meta }}<\u002Fspan>\n                    <span style=\"font-size:12px;opacity:.5;width:12px\">{{ m.chev }}<\u002Fspan>\n                  <\u002Fbutton>\n                  <sc-if value=\"{{ m.open }}\">\n                    <div style=\"padding:0 18px 14px 56px;display:flex;flex-direction:column;gap:8px\">\n                      <sc-for list=\"{{ m.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                        <div style=\"display:flex;align-items:center;gap:12px;font-size:14px;padding:6px 0;border-top:1px solid var(--color-divider)\">\n                          <span class=\"tag tag-neutral\" style=\"min-width:74px;justify-content:center\">{{ it.tipo }}<\u002Fspan>\n                          <span style=\"flex:1\">{{ it.nombre }}<\u002Fspan>\n                          <span style=\"font-size:12px;opacity:.5\">{{ it.dur }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ tabDocente }}\">\n            <div style=\"display:flex;gap:20px\">\n              <div class=\"blueprint duotone\" style=\"width:120px;height:120px;flex:none;background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 8px,var(--color-accent-100) 8px 16px)\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><\u002Fdiv>\n              <div>\n                <h4 style=\"margin:0 0 2px\">Elena Ruiz<\u002Fh4>\n                <div style=\"font-size:13px;color:var(--color-accent);margin-bottom:10px\">Directora de imagen generativa · 4 cursos · 3.100 estudiantes<\u002Fdiv>\n                <p style=\"opacity:.78;font-size:14px;margin:0\">Trabaja desde 2019 con modelos de difusión aplicados a dirección de arte y producción editorial. En Praxis dirige el itinerario de imagen y diseña las evaluaciones demostrativas del laboratorio.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ tabForo }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ discusiones }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div class=\"card\" style=\"padding:14px 16px;cursor:pointer\" sc-camel-on-click=\"{{ goForo }}\">\n                  <div class=\"card-title\" style=\"font-size:16px\">{{ d.titulo }}<\u002Fdiv>\n                  <div class=\"card-meta\" style=\"gap:12px\"><span>{{ d.autor }}<\u002Fspan><span>{{ d.fecha }}<\u002Fspan><span>{{ d.respuestas }} respuestas<\u002Fspan><span>♥ {{ d.likes }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div class=\"blueprint\" style=\"padding:20px;position:sticky;top:60px;background:var(--color-surface)\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-family:var(--font-heading);font-size:34px;line-height:1\">Gratis<\u002Fdiv>\n          <div style=\"font-size:12px;opacity:.55;margin-bottom:18px\">Acceso completo · certificado incluido<\u002Fdiv>\n          <button class=\"btn btn-primary btn-block blueprint\" sc-camel-on-click=\"{{ openModal }}\" style=\"padding:11px;margin:0\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Inscribirme al curso<\u002Fbutton>\n          <div style=\"margin-top:18px;padding-top:14px;border-top:1px solid var(--color-divider);display:flex;flex-direction:column;gap:9px;font-size:13px\">\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"opacity:.6\">Módulos<\u002Fspan><span>5<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"opacity:.6\">Lecciones<\u002Fspan><span>24<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"opacity:.6\">Actividades<\u002Fspan><span>11<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"opacity:.6\">Evaluación<\u002Fspan><span>Demostrativa<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"opacity:.6\">Idioma<\u002Fspan><span>Español<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ modal }}\">\n        <div class=\"dialog-backdrop\" style=\"z-index:60\">\n          <div class=\"dialog blueprint\" style=\"background:var(--color-bg)\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div class=\"dialog-title\">Confirmar inscripción<\u002Fdiv>\n            <div class=\"dialog-body\">Vas a inscribirte en <strong>Creación de imágenes con IA<\u002Fstrong>. El curso aparecerá en tu panel y podrás retomarlo cuando quieras.<\u002Fdiv>\n            <div class=\"dialog-actions\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closeModal }}\">Cancelar<\u002Fbutton>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ confirmarInscripcion }}\">Inscribirme<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ APP ESTUDIANTE ══ -->\n  <sc-if value=\"{{ inApp }}\">\n    <div class=\"shell\" style=\"display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 41px)\">\n      <aside style=\"border-right:1px solid var(--color-divider);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:41px;height:calc(100vh - 41px)\">\n        <div style=\"font-family:var(--font-heading);font-weight:600;font-size:18px;padding:0 10px 18px\">PRAXIS<span style=\"color:var(--color-accent)\">.AI<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ n.go }}\" style=\"{{ n.style }}\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ n.d }}\"><\u002Fpath><\u002Fsvg>\n            <span style=\"flex:1;text-align:left\">{{ n.label }}<\u002Fspan>\n            <span style=\"font-size:11px;opacity:.55\">{{ n.badge }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"margin-top:auto;border-top:1px solid var(--color-divider);padding-top:14px;display:flex;align-items:center;gap:10px\">\n          <div class=\"duotone\" style=\"width:30px;height:30px;flex:none;border:1px solid var(--color-divider);background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 5px,var(--color-accent-100) 5px 10px)\"><\u002Fdiv>\n          <div style=\"line-height:1.2\"><div style=\"font-size:13px\">Miquel Torrent<\u002Fdiv><div style=\"font-size:11px;opacity:.5\">Estudiante<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Faside>\n\n      <main>\n        <header style=\"display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--color-divider);position:sticky;top:41px;background:var(--color-bg);z-index:20\">\n          <input class=\"input\" placeholder=\"Buscar cursos, lecciones, foros…\" style=\"max-width:340px\">\n          <div style=\"margin-left:auto;display:flex;align-items:center;gap:12px\">\n            <button class=\"btn btn-secondary btn-icon\" style=\"position:relative\">\n              <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M6 9a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6\"><\u002Fpath><path d=\"M10 20h4\"><\u002Fpath><\u002Fsvg>\n              <span style=\"position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--color-accent)\"><\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"duotone\" style=\"width:32px;height:32px;border:1px solid var(--color-divider);background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 5px,var(--color-accent-100) 5px 10px)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fheader>\n\n        <!-- Dashboard -->\n        <sc-if value=\"{{ scDashboard }}\">\n          <div style=\"padding:32px 28px 64px;max-width:1180px\">\n            <h2 style=\"margin:0 0 2px\">Hola, Miquel 👋<\u002Fh2>\n            <p style=\"opacity:.65;margin-bottom:26px\">Continúa aprendiendo donde lo dejaste.<\u002Fp>\n\n            <div class=\"blueprint split\" style=\"display:grid;grid-template-columns:300px 1fr;gap:0;margin-bottom:28px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div class=\"duotone\" style=\"border-right:1px solid var(--color-divider);min-height:190px;background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 10px,var(--color-accent-100) 10px 20px)\"><image-slot src=\"2c5af0b1-d849-4777-998e-242b83498b71\" id=\"dash-curso\" shape=\"rect\" placeholder=\"Imagen del curso\"><\u002Fimage-slot><\u002Fdiv>\n              <div style=\"padding:24px 26px;display:flex;flex-direction:column;justify-content:center\">\n                <div class=\"card-kicker\">Curso en progreso<\u002Fdiv>\n                <h3 style=\"margin:6px 0 4px\">Creación de imágenes con IA<\u002Fh3>\n                <div style=\"font-size:13px;opacity:.6;margin-bottom:18px\">Módulo 2 · Estructura de un prompt · Elena Ruiz<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:18px\">\n                  <div style=\"flex:1;height:6px;border:1px solid var(--color-divider);background:var(--color-bg)\"><div style=\"height:100%;width:72%;background:var(--color-accent)\"><\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-family:var(--font-heading);font-size:20px\">72%<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:10px\">\n                  <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ goAprender }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Continuar curso<\u002Fbutton>\n                  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goCurso }}\">Ver temario<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"g4\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px\">\n              <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div class=\"card blueprint\" style=\"padding:16px 18px;gap:2px\">\n                  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                  <div style=\"font-family:var(--font-heading);font-size:38px;line-height:1\">{{ s.v }}<\u002Fdiv>\n                  <div style=\"font-size:12px;opacity:.6\">{{ s.l }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div class=\"split\" style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:28px\">\n              <div>\n                <h4 style=\"margin:0 0 12px\">Próximas actividades<\u002Fh4>\n                <div style=\"border:1px solid var(--color-divider)\">\n                  <sc-for list=\"{{ proximas }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--color-divider)\">\n                      <span class=\"tag tag-accent\" style=\"min-width:88px;justify-content:center\">{{ p.tipo }}<\u002Fspan>\n                      <div style=\"flex:1\"><div style=\"font-size:14px\">{{ p.titulo }}<\u002Fdiv><div style=\"font-size:12px;opacity:.5\">{{ p.curso }}<\u002Fdiv><\u002Fdiv>\n                      <span style=\"font-size:12px;opacity:.6\">{{ p.cuando }}<\u002Fspan>\n                      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ p.go }}\" style=\"font-size:13px\">Abrir<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <h4 style=\"margin:0 0 12px\">Tu ritmo<\u002Fh4>\n                <div class=\"blueprint\" style=\"padding:18px\">\n                  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                  <div style=\"display:flex;align-items:flex-end;gap:8px;height:110px\">\n                    <sc-for list=\"{{ ritmo }}\" as=\"b\" hint-placeholder-count=\"7\">\n                      <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%\">\n                        <div style=\"{{ b.style }}\"><\u002Fdiv>\n                        <span style=\"font-size:10px;opacity:.5\">{{ b.d }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px;opacity:.6;margin-top:12px;border-top:1px solid var(--color-divider);padding-top:10px\">4 h 20 min esta semana · racha de 6 días<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Mis cursos -->\n        <sc-if value=\"{{ scMisCursos }}\">\n          <div style=\"padding:32px 28px 64px;max-width:1180px\">\n            <h2 style=\"margin:0 0 22px\">Mis cursos<\u002Fh2>\n            <div class=\"g3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-bottom:36px\">\n              <sc-for list=\"{{ misCursos }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div class=\"card blueprint\" style=\"padding:0;gap:0\">\n                  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                  <div class=\"duotone\" style=\"aspect-ratio:16/9;border-bottom:1px solid var(--color-divider);background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 10px,var(--color-accent-100) 10px 20px)\"><image-slot src=\"2c5af0b1-d849-4777-998e-242b83498b71\" id=\"{{ c.slot }}\" shape=\"rect\" placeholder=\"Imagen del curso\"><\u002Fimage-slot><\u002Fdiv>\n                  <div style=\"padding:16px;display:flex;flex-direction:column;gap:10px;flex:1\">\n                    <div class=\"card-title\">{{ c.nombre }}<\u002Fdiv>\n                    <div style=\"font-size:12px;opacity:.55\">{{ c.docente }} · {{ c.restante }}<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:10px\">\n                      <div style=\"flex:1;height:6px;border:1px solid var(--color-divider)\"><div style=\"{{ c.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                      <span style=\"font-size:12px\">{{ c.pct }}%<\u002Fspan>\n                    <\u002Fdiv>\n                    <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ goAprender }}\" style=\"font-size:13px\">{{ c.cta }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <h4 style=\"margin:0 0 12px\">Completados<\u002Fh4>\n            <div class=\"blueprint\" style=\"padding:40px;display:grid;place-items:center;text-align:center\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"max-width:36ch\">\n                <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" style=\"opacity:.35;margin:0 auto 10px\"><path d=\"M4 4h16v16H4z\"><\u002Fpath><path d=\"M8 12l3 3 5-6\"><\u002Fpath><\u002Fsvg>\n                <div style=\"font-family:var(--font-heading);font-size:18px\">Todavía no has completado ningún curso<\u002Fdiv>\n                <p style=\"font-size:13px;opacity:.6;margin:6px 0 14px\">Cuando termines un curso aparecerá aquí junto a su certificado.<\u002Fp>\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goCatalogo }}
