\">Explorar cursos<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Vista de aprendizaje -->\n        <sc-if value=\"{{ scAprender }}\">\n          <div class=\"learn\" style=\"display:grid;grid-template-columns:270px 1fr 260px;min-height:calc(100vh - 100px)\">\n            <div class=\"learnnav\" style=\"border-right:1px solid var(--color-divider);padding:20px 16px;overflow:auto\">\n              <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-bottom:12px\">Contenido del curso<\u002Fdiv>\n              <sc-for list=\"{{ temario }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"margin-bottom:18px\">\n                  <div style=\"font-family:var(--font-heading);font-size:15px;margin-bottom:6px\">{{ m.titulo }}<\u002Fdiv>\n                  <sc-for list=\"{{ m.lecciones }}\" as=\"l\" hint-placeholder-count=\"2\">\n                    <div style=\"{{ l.style }}\"><span style=\"width:14px;opacity:.75\">{{ l.mark }}<\u002Fspan><span>{{ l.nombre }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"padding:28px 34px 60px;max-width:760px\">\n              <div style=\"font-size:12px;opacity:.55;margin-bottom:8px\">Módulo 2 · Lección 2 de 4<\u002Fdiv>\n              <h2 style=\"margin:0 0 16px\">Estructura de un prompt<\u002Fh2>\n              <div class=\"blueprint duotone\" style=\"aspect-ratio:16/9;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 12px,var(--color-accent-100) 12px 24px);margin-bottom:22px\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <div style=\"display:flex;align-items:center;gap:10px;background:var(--color-bg);border:1px solid var(--color-divider);padding:8px 14px\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M8 5l11 7-11 7z\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"font-family:var(--font-heading);font-size:13px;letter-spacing:.1em;text-transform:uppercase\">Vídeo · 12:40<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"opacity:.8\">Un prompt eficaz se descompone en cinco decisiones explícitas. Cuanto más concretas sean, menos margen queda para que el modelo improvise en la dirección equivocada.<\u002Fp>\n              <div class=\"g5\" style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--color-divider);margin:20px 0\">\n                <div style=\"padding:12px;border-right:1px solid var(--color-divider)\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)\">Sujeto<\u002Fdiv><div style=\"font-size:12px;opacity:.65;margin-top:4px\">Qué aparece<\u002Fdiv><\u002Fdiv>\n                <div style=\"padding:12px;border-right:1px solid var(--color-divider)\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)\">Estilo<\u002Fdiv><div style=\"font-size:12px;opacity:.65;margin-top:4px\">Referencia visual<\u002Fdiv><\u002Fdiv>\n                <div style=\"padding:12px;border-right:1px solid var(--color-divider)\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)\">Luz<\u002Fdiv><div style=\"font-size:12px;opacity:.65;margin-top:4px\">Hora y dirección<\u002Fdiv><\u002Fdiv>\n                <div style=\"padding:12px;border-right:1px solid var(--color-divider)\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)\">Composición<\u002Fdiv><div style=\"font-size:12px;opacity:.65;margin-top:4px\">Plano y encuadre<\u002Fdiv><\u002Fdiv>\n                <div style=\"padding:12px\"><div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)\">Contexto<\u002Fdiv><div style=\"font-size:12px;opacity:.65;margin-top:4px\">Dónde y cuándo<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--color-divider);background:var(--color-surface);padding:14px 16px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6\">\n                <span style=\"opacity:.45\">// ejemplo<\u002Fspan><br>\n                <span style=\"color:var(--color-accent-700)\">sujeto:<\u002Fspan> mercado de barrio al amanecer<br>\n                <span style=\"color:var(--color-accent-700)\">estilo:<\u002Fspan> fotografía documental en color, grano fino<br>\n                <span style=\"color:var(--color-accent-700)\">luz:<\u002Fspan> lateral cálida, sombras largas<br>\n                <span style=\"color:var(--color-accent-700)\">composición:<\u002Fspan> plano medio, regla de tercios<br>\n                <span style=\"color:var(--color-accent-700)\">contexto:<\u002Fspan> ciudad mediterránea, día laborable\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--color-divider)\">\n                <button class=\"btn btn-secondary\">← Anterior<\u002Fbutton>\n                <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ marcarCompletado }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Marcar como completado<\u002Fbutton>\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goActividad }}\" style=\"margin-left:auto\">Siguiente: Actividad práctica →<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"learnside\" style=\"border-left:1px solid var(--color-divider);padding:20px 18px\">\n              <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-bottom:14px\">Tu progreso<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-size:46px;line-height:1\">72%<\u002Fdiv>\n              <div style=\"height:6px;border:1px solid var(--color-divider);margin:10px 0 8px\"><div style=\"height:100%;width:72%;background:var(--color-accent)\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size:12px;opacity:.6\">8 de 11 actividades completadas<\u002Fdiv>\n              <div style=\"margin-top:22px;padding-top:16px;border-top:1px solid var(--color-divider);display:flex;flex-direction:column;gap:10px;font-size:13px\">\n                <div style=\"display:flex;justify-content:space-between\"><span style=\"opacity:.6\">Lecciones<\u002Fspan><span>16 / 24<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between\"><span style=\"opacity:.6\">Actividades<\u002Fspan><span>8 / 11<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between\"><span style=\"opacity:.6\">Evaluación<\u002Fspan><span style=\"color:var(--color-accent)\">Pendiente<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"blueprint\" style=\"margin-top:22px;padding:14px\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <div style=\"font-family:var(--font-heading);font-size:15px;margin-bottom:4px\">Evaluación final<\u002Fdiv>\n                <p style=\"font-size:12px;opacity:.6;margin:0 0 10px\">Se desbloquea al completar el módulo 4.<\u002Fp>\n                <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ goEvaluaciones }}\" style=\"font-size:13px;margin:0\">Ver requisitos<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Actividad -->\n        <sc-if value=\"{{ scActividad }}\">\n          <div style=\"padding:32px 28px 64px;max-width:860px\">\n            <div style=\"font-size:12px;opacity:.55;margin-bottom:8px\">Creación de imágenes con IA / Módulo 2<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:6px\">\n              <span class=\"tag tag-accent\">Actividad<\u002Fspan><span style=\"font-size:12px;opacity:.55\">Intento 1 de 3 · 20 puntos<\u002Fspan>\n            <\u002Fdiv>\n            <h2 style=\"margin:0 0 10px\">Crea tu primer prompt<\u002Fh2>\n            <p style=\"opacity:.78;max-width:64ch\">Utiliza los conocimientos aprendidos para crear un prompt capaz de generar una imagen coherente.<\u002Fp>\n\n            <h4 style=\"margin:26px 0 10px\">Instrucciones<\u002Fh4>\n            <div style=\"border:1px solid var(--color-divider)\">\n              <sc-for list=\"{{ instrucciones }}\" as=\"i\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;gap:14px;padding:11px 16px;border-bottom:1px solid var(--color-divider);font-size:14px\">\n                  <span style=\"font-family:var(--font-heading);color:var(--color-accent);width:20px\">{{ i.n }}<\u002Fspan><span>{{ i.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <h4 style=\"margin:26px 0 10px\">Tu respuesta<\u002Fh4>\n            <textarea class=\"input\" placeholder=\"Escribe tu respuesta…\" style=\"min-height:170px;font-size:14px\"><\u002Ftextarea>\n            <div style=\"display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;opacity:.55\">\n              <span>0 / 800 caracteres<\u002Fspan><span style=\"margin-left:auto\">Guardado automático hace 1 min<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;margin-top:20px\">\n              <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ enviarActividad }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Enviar actividad<\u002Fbutton>\n              <button class=\"btn btn-secondary\">Guardar borrador<\u002Fbutton>\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goPreguntas }}\" style=\"margin-left:auto\">Ir a las preguntas →<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Preguntas -->\n        <sc-if value=\"{{ scPreguntas }}\">\n          <div style=\"padding:32px 28px 64px;max-width:760px\">\n            <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px\">\n              <span class=\"tag tag-accent\">Pregunta 3 de 6<\u002Fspan>\n              <div style=\"flex:1;height:4px;border:1px solid var(--color-divider)\"><div style=\"height:100%;width:50%;background:var(--color-accent)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <h3 style=\"margin:0 0 20px\">¿Cuál es la diferencia entre un prompt descriptivo y uno estructurado?<\u002Fh3>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ opciones }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\">\n                  <span style=\"font-family:var(--font-heading);width:18px;opacity:.6\">{{ o.letra }}<\u002Fspan>\n                  <span style=\"flex:1;text-align:left\">{{ o.texto }}<\u002Fspan>\n                  <span>{{ o.mark }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ respondido }}\">\n              <div class=\"blueprint\" style=\"margin-top:22px;padding:18px;animation:riseIn .25s ease\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <div style=\"font-family:var(--font-heading);font-size:16px;margin-bottom:6px\">{{ vereditoTexto }}<\u002Fdiv>\n                <p style=\"font-size:14px;opacity:.78;margin:0\">El prompt descriptivo enumera lo que se quiere ver en lenguaje corriente. El estructurado separa las decisiones en campos — sujeto, estilo, luz, composición, contexto — de modo que cada una puede ajustarse sin reescribir el resto y el resultado es reproducible entre generaciones.<\u002Fp>\n                <div style=\"display:flex;gap:10px;margin-top:16px\">\n                  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ resetPregunta }}\">Reintentar<\u002Fbutton>\n                  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goEvaluaciones }}\">Siguiente pregunta<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Foro -->\n        <sc-if value=\"{{ scForo }}\">\n          <div style=\"padding:32px 28px 64px;max-width:960px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px\">\n              <h2 style=\"margin:0\">Foro del curso<\u002Fh2>\n              <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ showToastForo }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>+ Nueva discusión<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"opacity:.6;margin-bottom:22px\">Creación de imágenes con IA · 34 discusiones<\u002Fp>\n            <div class=\"split\" style=\"display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start\">\n              <div style=\"border:1px solid var(--color-divider)\">\n                <sc-for list=\"{{ discusiones }}\" as=\"d\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--color-divider)\">\n                    <div class=\"duotone\" style=\"width:34px;height:34px;flex:none;border:1px solid var(--color-divider);background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 5px,var(--color-accent-100) 5px 10px)\"><\u002Fdiv>\n                    <div style=\"flex:1\">\n                      <div style=\"font-family:var(--font-heading);font-size:17px;margin-bottom:2px\">{{ d.titulo }}<\u002Fdiv>\n                      <div style=\"font-size:12px;opacity:.55\">{{ d.autor }} · {{ d.fecha }} · última actividad {{ d.ultima }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"text-align:right;font-size:12px;opacity:.6;white-space:nowrap\"><div>{{ d.respuestas }} respuestas<\u002Fdiv><div>♥ {{ d.likes }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"padding:20px\">\n                  <div style=\"font-family:var(--font-heading);font-size:16px;margin-bottom:12px\">¿Qué estructura utilizan para sus prompts?<\u002Fdiv>\n                  <div style=\"display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--color-divider)\">\n                    <div class=\"duotone\" style=\"width:30px;height:30px;flex:none;border:1px solid var(--color-divider);background:repeating-linear-gradient(45deg,var(--color-accent-200) 0 5px,var(--color-accent-100) 5px 10px)\"><\u002Fdiv>\n                    <div><div style=\"font-size:12px;opacity:.55;margin-bottom:3px\">Laura Benítez · hace 2 h<\u002Fdiv><p style=\"font-size:14px;margin:0;opacity:.85\">Yo mantengo los cinco campos fijos y guardo cada variación en una hoja. Cuando algo falla suele ser la luz, no el sujeto.<\u002Fp><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:10px;margin-top:12px\">\n                    <input class=\"input\" placeholder=\"Escribe una respuesta…\">\n                    <button class=\"btn btn-primary\" style=\"flex:none\">Responder<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"blueprint\" style=\"padding:18px\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-bottom:10px\">Normas del foro<\u002Fdiv>\n                <p style=\"font-size:13px;opacity:.7;margin:0\">Comparte el prompt completo cuando pidas ayuda. Marca como resuelta la discusión cuando obtengas respuesta.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Evaluaciones -->\n        <sc-if value=\"{{ scEvaluaciones }}\">\n          <div style=\"padding:32px 28px 64px;max-width:900px\">\n            <h2 style=\"margin:0 0 22px\">Evaluaciones<\u002Fh2>\n            <div class=\"blueprint\" style=\"padding:24px 26px;margin-bottom:18px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n                <span class=\"tag tag-outline\">Disponible<\u002Fspan><span style=\"font-size:12px;opacity:.55\">Creación de imágenes con IA<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"margin:0 0 6px\">Evaluación final<\u002Fh3>\n              <p style=\"opacity:.75;max-width:60ch;margin-bottom:18px\">Proyecto demostrativo — Generación de imágenes mediante IA.<\u002Fp>\n              <div class=\"g4\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--color-divider);margin-bottom:20px\">\n                <div style=\"padding:12px 14px;border-right:1px solid var(--color-divider)\"><div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.5\">Duración<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:20px\">30 min<\u002Fdiv><\u002Fdiv>\n                <div style=\"padding:12px 14px;border-right:1px solid var(--color-divider)\"><div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.5\">Intentos<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:20px\">1<\u002Fdiv><\u002Fdiv>\n                <div style=\"padding:12px 14px;border-right:1px solid var(--color-divider)\"><div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.5\">Puntuación<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:20px\">100<\u002Fdiv><\u002Fdiv>\n                <div style=\"padding:12px 14px\"><div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.5\">Aprobado<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:20px\">70<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ goLab }}\" style=\"padding:11px 20px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Comenzar evaluación<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"card\" style=\"padding:18px 20px;opacity:.6\">\n              <div style=\"display:flex;align-items:center;gap:10px\"><span class=\"tag tag-neutral\">Bloqueada<\u002Fspan><span style=\"font-size:12px\">Fundamentos de prompting<\u002Fspan><\u002Fdiv>\n              <div class=\"card-title\">Evaluación intermedia — Reescritura de prompts<\u002Fdiv>\n              <div class=\"card-meta\">Se desbloquea al completar el módulo 3<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Laboratorio -->\n        <sc-if value=\"{{ scLab }}\">\n          <div style=\"padding:24px 28px 64px\">\n            <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--color-divider)\">\n              <span class=\"tag tag-accent\">Evaluación final<\u002Fspan>\n              <span style=\"font-family:var(--font-heading);font-size:18px\">Genera una imagen mediante IA<\u002Fspan>\n              <span style=\"margin-left:auto;font-family:var(--font-heading);font-size:20px;border:1px solid var(--color-divider);padding:3px 12px\">{{ reloj }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <div class=\"split\" style=\"display:grid;grid-template-columns:420px 1fr;gap:28px;align-items:start\">\n              <div>\n                <div class=\"blueprint\" style=\"padding:18px;margin-bottom:18px\">\n                  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                  <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-bottom:8px\">Instrucción<\u002Fdiv>\n                  <p style=\"margin:0;font-size:15px;opacity:.9\">Utiliza tus conocimientos de prompting para generar una imagen que represente una ciudad futurista sostenible.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-bottom:8px\">Prompt<\u002Fdiv>\n                <textarea class=\"input\" placeholder=\"Escribe aquí tu prompt…\" value=\"{{ prompt }}\" sc-camel-on-change=\"{{ setPrompt }}\" style=\"min-height:150px;font-size:14px;font-family:ui-monospace,Menlo,monospace\"><\u002Ftextarea>\n                <div style=\"display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap\">\n
